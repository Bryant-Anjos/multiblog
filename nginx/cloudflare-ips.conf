# Cloudflare's published edge ranges — the ONE list this deployment trusts.
#
# GENERATED FILE. Refresh with:
#   ./scripts/update-cloudflare-ips.sh
#
# ── Why this exists (Phase 45.1) ───────────────────────────────────────────
#
# The domain is proxied by Cloudflare, so every request nginx sees comes from
# a Cloudflare edge, not from the visitor. Left alone, `$remote_addr` would be
# Cloudflare's address — and this stack writes `$remote_addr` into
# `X-Forwarded-For` for the API, which rate-limits by it. Every visitor on
# earth would share a handful of buckets, and the limits would block real
# people while stopping no one.
#
# `real_ip_header CF-Connecting-IP` fixes it at the source: the realip module
# runs before anything else reads `$remote_addr`, so the ENTIRE rest of the
# configuration — the X-Forwarded-For overwrite, the access log, everything —
# keeps working unchanged and correctly. That is why this is a four-line
# include and not a rewrite of the site template.
#
# `set_real_ip_from` is the trust list: only a request arriving FROM one of
# these addresses may claim a client IP. Without it the header would be
# believed from anywhere, which is the same bypass 2026-08-17 closed, just
# with a different header name.
#
# CF-Connecting-IP rather than X-Forwarded-For: Cloudflare writes exactly one
# value into it, always the real client. X-Forwarded-For arrives with whatever
# the client sent still in it, which would need `real_ip_recursive` and a
# correct trust chain to be safe.
#
# STALENESS: Cloudflare adds ranges occasionally. A missing range does not
# break the site — those visitors simply get bucketed by their Cloudflare edge
# address instead of their own. Re-run the script above once in a while, and
# whenever rate limiting starts behaving oddly for a group of users.
#
# Ranges fetched 2026-08-18 from https://www.cloudflare.com/ips-v4 and /ips-v6

