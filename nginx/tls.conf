# TLS parameters, shared by every vhost (Phase 45.1).
#
# ── Why this replaced certbot's options-ssl-nginx.conf ─────────────────────
#
# Until now the site template included `/etc/letsencrypt/options-ssl-nginx.conf`
# and an `ssl_dhparam`, both produced by certbot — which meant
# `init-letsencrypt.sh` had to `curl` two files from certbot's GitHub at
# bootstrap time, and `scripts/local-prod-certs.sh` had to hand-write a
# stand-in for them so the local stack could start at all.
#
# With Cloudflare origin certificates there is no certbot in the normal path,
# so those files would simply not exist. Rather than have the cert-installing
# script fabricate certbot's artefacts, the settings live here: one file, in
# the repo, identical in every environment, with nothing fetched over the
# network while a deploy is running.
#
# ── The settings ──────────────────────────────────────────────────────────
#
# TLS 1.2 and 1.3 only. 1.0/1.1 are deprecated and no browser this app
# supports needs them.
ssl_protocols TLSv1.2 TLSv1.3;

# The cipher list is ECDHE-only, which is also why there is no `ssl_dhparam`
# here any more: that parameter is used exclusively by the DHE ciphers, and
# with none offered, generating and shipping a 2048/4096-bit prime bought
# nothing (it did cost every fresh environment a few seconds of `openssl
# dhparam` and a file to keep track of).
#
# TLS 1.3's own suites are not configurable through `ssl_ciphers` and are
# always enabled; this list only governs 1.2.
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

# A shared session cache across workers, so a returning visitor resumes
# instead of paying for a full handshake. Tickets are off: they are the one
# part of session resumption that can undermine forward secrecy, since a
# long-lived ticket key decrypts past sessions.
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# OCSP stapling is deliberately NOT enabled. With the domain proxied by
# Cloudflare, the only client completing a handshake with this origin is
# Cloudflare itself, which does not need a stapled response — and a
# Cloudflare *origin* certificate has no public OCSP responder to staple
# from, so turning it on would produce a warning on every reload and nothing
# else. Revisit alongside any move back to publicly-trusted certificates at
# the origin.
